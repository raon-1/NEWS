<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ELECTRIC NEWS LAB</title><meta name="description" content="학생을 위한 주간 전기 에너지 뉴스"><style>
:root{--navy:#10243a;--green:#65d6a5;--bg:#f3f6fa;--ink:#182b40}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;color:var(--ink)}header{background:var(--navy);color:white;padding:36px max(5vw,20px) 28px}header h1{margin:8px 0;font-size:clamp(28px,5vw,44px)}header p{color:#bdcad7}main{max-width:1100px;margin:auto;padding:24px 20px}.search{width:100%;padding:14px;border:1px solid #dbe3eb;border-radius:12px;font-size:16px;margin:12px 0}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 22px}.filters button{border:0;border-radius:999px;padding:10px 14px;background:#e0e8f0;cursor:pointer}.filters button.active{background:var(--navy);color:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}.card{background:white;border-radius:18px;padding:20px;box-shadow:0 4px 20px #10243a0a}.tag{color:#087b55;font-size:13px;font-weight:700}.card h3{margin:10px 0;font-size:19px}.card p{color:#566579;line-height:1.6}.card a{color:#176a53;font-weight:700;text-decoration:none}.meta{font-size:13px;color:#718096;margin:10px 0}.empty{padding:50px;text-align:center;color:#667}.foot{margin-top:30px;color:#718096;font-size:13px;text-align:center}.week{color:var(--green);font-weight:800;letter-spacing:1px} </style></head>
<body><header><div class="week">⚡ WEEKLY ELECTRIC NEWS</div><h1>ELECTRIC NEWS LAB</h1><p>전기의 미래를 읽다. 전기 · 에너지 · 기술 뉴스 학습 공간</p><p id="updated">뉴스 업데이트 확인 중...</p></header><main><h2>📰 이번 주 전기 뉴스</h2><p>뉴스를 읽고 전기 분야의 새로운 기술과 용어를 익혀 보세요.</p><input id="search" class="search" placeholder="기사 제목, 키워드, 언론사 검색..." aria-label="뉴스 검색"><div id="filters" class="filters"></div><div id="news" class="grid"></div><div class="foot">뉴스 원문은 각 언론사 및 발행처에 있습니다. 제목과 링크를 제공하며 원문 저작권을 존중합니다.<br>뉴스 수집은 매주 자동 실행됩니다.</div></main><script>
let articles=[],category='전체';const categories=['전체','전력','신재생에너지','배터리','전기차','전기 안전','전기 기술'];const filters=document.querySelector('#filters');
categories.forEach(c=>{let b=document.createElement('button');b.textContent=c;b.onclick=()=>{category=c;filters.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));render()};if(c==='전체')b.classList.add('active');filters.append(b)});
document.querySelector('#search').addEventListener('input',render);
function render(){const q=document.querySelector('#search').value.toLowerCase();const data=articles.filter(a=>(category==='전체'||a.category===category)&&((a.title+' '+a.source+' '+a.category).toLowerCase().includes(q)));const box=document.querySelector('#news');box.innerHTML='';if(!data.length){box.innerHTML='<div class="empty">표시할 뉴스가 없습니다. 수집 데이터가 준비되면 여기에 나타납니다.</div>';return}data.forEach(a=>{let el=document.createElement('article');el.className='card';el.innerHTML='<div class="tag"></div><h3></h3><div class="meta"></div><p></p><a target="_blank" rel="noopener noreferrer">기사 원문 읽기 ↗</a>';el.querySelector('.tag').textContent=a.category;el.querySelector('h3').textContent=a.title;el.querySelector('.meta').textContent=(a.source||'뉴스')+' · '+(a.date||'');el.querySelector('p').textContent=a.summary||'기사 제목을 통해 관련 기술과 산업 동향을 살펴보세요. 원문에서 자세한 내용을 확인할 수 있습니다.';el.querySelector('a').href=a.url;box.append(el)})}
fetch('data/news.json').then(r=>r.ok?r.json():Promise.reject()).then(d=>{articles=d.articles||[];document.querySelector('#updated').textContent='마지막 수집: '+(d.updated||'정보 없음')+' · '+articles.length+'개 기사';render()}).catch(()=>{document.querySelector('#updated').textContent='뉴스 데이터가 아직 준비되지 않았습니다. 자동 수집을 기다려 주세요.';render()});
</script></body></html>
